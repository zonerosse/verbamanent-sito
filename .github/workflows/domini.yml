name: Domini liberi (whois)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["strumenti/domini.txt"]
permissions:
  contents: write
jobs:
  whois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq whois
      - run: python3 strumenti/domini.py
      - name: Salva i risultati
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add strumenti/domini.csv
          git diff --cached --quiet || (git commit -m "Domini: risultati whois" && git pull --rebase -q && git push)
