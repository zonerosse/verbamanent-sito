name: Parole chiave (DataForSEO)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["seo/parole.txt", "seo/semi.txt"]
permissions:
  contents: write
jobs:
  volumi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Chiede i volumi a DataForSEO
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python seo/parole.py
      - name: Salva i risultati nel repository
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A seo
          git diff --cached --quiet || (git commit -m "Parole chiave: risultati DataForSEO" && git push)
