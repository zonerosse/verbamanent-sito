# Il menu in alto: due tendine («Per chi è», «Come funziona») e tre voci semplici. Sul telefono le stesse voci, divise per gruppo.
# Ogni voce: pag (pagina) oppure id (pezzo della home); ic = icona (simboli mn-* in baseof); d = spiegazione nella tendina, dt = sul telefono.
menu:
  - gruppo: "Per chi è"
    tit: "Per chi è Verba Manent"
    voci:
      - { pag: "per-studiare", t: "Per studiare", ic: "studio", d: "Appunti Cornell, flashcard e ripasso giorno per giorno fino all'esame.", dt: "Appunti, flashcard e ripasso" }
      - { pag: "dsa", t: "DSA", ic: "dsa", d: "Lo Spazio DSA: lettura ad alta voce, mappe, verifiche con il 30% di tempo in più.", dt: "Lo Spazio DSA" }
      - { pag: "riunioni", t: "Riunioni", ic: "riunioni", d: "Il verbale pronto: chi ha detto cosa, decisioni e cose da fare.", dt: "Il verbale pronto" }
    lato: { k: "Novità", t: "Per genitori e insegnanti", p: "La guida al PDP passo passo e il modello gratuito da compilare e portare a scuola.", link: "Apri il modello", pag: "/guide/modello-pdp" }
    piede: { t: "Non sai da dove partire?", link: "Guarda come funziona in 3 passi", id: "come" }
  - gruppo: "Come funziona"
    tit: "Come funziona"
    voci:
      - { id: "come", t: "In tre passi", ic: "passi", d: "Registri, trascrive sul tuo PC, ti dà gli appunti pronti.", dt: "Registra, trascrive, appunti" }
      - { pag: "pc-e-telefono", t: "PC e telefono", ic: "dispositivi", d: "Windows, Android e il web: le lezioni uguali su tutti i dispositivi.", dt: "Le lezioni su tutti i dispositivi" }
      - { pag: "la-tua-privacy", t: "Privacy", ic: "privacy", d: "L'audio resta sul tuo PC. Nessuna impronta della voce, nessun addestramento.", dt: "L'audio resta sul tuo PC" }
    lato: { k: "In breve", t: "Le registrazioni non vanno su internet", p: "La trascrizione avviene sul tuo computer. Per gli appunti a Claude arriva solo il testo, mai l'audio.", link: "Leggi la privacy", pag: "la-tua-privacy" }
    piede: { t: "Vuoi vederlo a confronto?", link: "Verba Manent e le altre app", id: "confronto" }
  - { id: "confronto", t: "Confronto" }
  - { id: "domande", t: "Domande" }
menu_altro: "Altro"
avvisami: "Avvisami"
prova: "Versione di prova del sito: non è ancora online per il pubblico."

# Schede principali della home: ognuna apre la sua pagina (content/<pag>.<lingua>.md, layouts/_default/scheda.html)
schede:
  kicker: "Scopri Verba Manent"
  h2: "Cosa ti serve?"
  p: "Scegli la scheda giusta per te: ognuna apre una pagina con tutte le sue funzioni e le schermate vere."
  apri: "Apri"
  torna: "Torna alla home"
  home: "Home"
  altre: "Le altre schede"
  voci:
    - { pag: "per-studiare", ic: "🎓", t: "Per studiare", p: "Appunti, flashcard, mappe e preparazione all'esame, da ogni lezione.", img: "cornell", h2: "Dalla lezione al giorno dell'esame", testo: "Registri la lezione, online o in aula. A fine lezione hai gli appunti in ordine, le flashcard, la mappa e le domande più probabili dell'esame.", punti: ["Appunti Cornell e Formato Esame, con le slide del docente", "Flashcard, mappe e Ripasso del giorno", "Simulazione d'esame con il voto"], link: "Tutto per studiare" }
    - { pag: "dsa", ic: "⭐", t: "DSA", p: "Lo Spazio DSA: tutti gli strumenti compensativi, in un posto solo.", img: "spazio-dsa", h2: "Lo Spazio DSA: tutti gli strumenti compensativi in un posto solo", testo: "Accendi la Modalità DSA e trovi in ordine quello che ti serve: in aula, dopo la lezione, per la verifica e per il docente.", punti: ["Karaoke della lezione con la voce vera del prof", "Come leggo meglio: carattere, spazi, sfondo", "Mappa per la verifica e test con il 30% di tempo in più"], link: "Tutto sullo Spazio DSA" }
    - { pag: "riunioni", ic: "💼", t: "Per le riunioni", p: "Il verbale si scrive da solo: decisioni, cose da fare, chi e entro quando.", img: "verbale", h2: "Il verbale si scrive da solo", testo: "Meet, Teams, Zoom o in sala: a fine riunione hai il verbale con le decisioni, le cose da fare con chi e entro quando, e chi ha detto cosa.", punti: ["Verbale pronto in PDF, da mandare con un tocco", "Le cose da fare raccolte da tutti i verbali", "Ogni riunione riparte da quello che era rimasto aperto"], link: "Tutto per le riunioni" }
    - { pag: "pc-e-telefono", ic: "📱", t: "Su PC e telefono", p: "Windows e Android, importa quello che hai già, veloce anche su un PC lento.", img: "telefono", h2: "Sul PC e sul telefono", testo: "Registri dal PC o dal telefono Android, oppure importi un video, un audio o una trascrizione che hai già. PC e telefono restano sincronizzati.", punti: ["Windows e Android, Mac e iPhone in arrivo", "Importa video, audio, link e trascrizioni", "Veloce anche su un PC lento"], link: "Tutto su PC e telefono" }
    - { pag: "la-tua-privacy", ic: "🔒", t: "Privacy", p: "Le registrazioni restano tue: niente server, nessuna impronta della voce.", img: "prima-di-iniziare", h2: "Le tue registrazioni restano tue", testo: "La trascrizione avviene sul tuo PC o sul telefono: noi non riceviamo le tue registrazioni e nessuna IA viene addestrata con le tue lezioni.", punti: ["Nessuna impronta della voce, mai", "Un messaggio pronto per avvisare chi registri", "La privacy spiegata in quattro righe, al primo avvio"], link: "Tutto sulla privacy" }

# Cosa c'è in ogni pagina. "schermate": [sezione, numero] da vetrina/inpiu/dsa; "carte": numeri delle voci di "fa" (da 0).
pagine:
  per-studiare:
    - kicker: "Per studiare"
      h2: "Dalla lezione al giorno dell'esame"
      p: "Registri la lezione, online o in aula: Verba Manent la trascrive e ti consegna tutto quello che serve per studiare."
      schermate: [[vetrina, 0], [vetrina, 1], [vetrina, 2], [vetrina, 3], [vetrina, 4], [vetrina, 5], [vetrina, 6], [vetrina, 7]]
      carte: [0, 1, 2, 3, 4, 5, 15]
  dsa:
    - { tipo: "dsa" }
  riunioni:
    - kicker: "Per le riunioni"
      h2: "Il verbale si scrive da solo"
      p: "Meet, Teams, Zoom o in sala: a fine riunione hai il verbale, le cose da fare e chi ha detto cosa."
      schermate: [[vetrina, 8], [vetrina, 9], [vetrina, 10], [vetrina, 11]]
      carte: [6, 7, 8]
  pc-e-telefono:
    - kicker: "Su PC e telefono"
      h2: "Dove vuoi, come vuoi"
      p: "Sul PC e sul telefono, con le lezioni che registri o con quelle che hai già."
      video: { v: "inizia-qui", img: "inizia-qui", ic: "🚀", k: "Inizia qui", h2: "Pronto in 3 passi, al primo avvio", testo: "Verba Manent ti guida: un accesso con Google per avere le stesse lezioni su PC, telefono e web, la chiave di Claude con i link e i passi giusti (con l'abbonamento non serve), e il QR per collegare il telefono.", punti: ["Un accesso solo, per tutto", "La chiave si incolla da sola", "Telefono e web collegati in un minuto"] }
      schermate: [[inpiu, 2], [inpiu, 3], [inpiu, 4]]
      carte: [9, 10, 11, 12, 13, 14]
      piattaforme: true
  la-tua-privacy:
    - { tipo: "nonfa" }
    - kicker: "E in più"
      h2: "Rispettoso di chi registri"
      p: "Le attenzioni che fanno la differenza, per te e per chi registri."
      schermate: [[inpiu, 0], [inpiu, 1]]

hero:
  pill: "🎓 Dalla lezione all'esame"
  h1a: "Le parole volano."
  h1b: "Gli appunti restano."
  lead: "Registra la lezione, ti dà gli appunti e ti accompagna fino all'esame: con la voce vera del prof, un tutor che sa quando hai l'esame e gli strumenti per chi ha un DSA. Tutto resta sul tuo dispositivo."
  cta1: "Avvisami quando esce"
  cta2: "Guarda come funziona"
  trust:
    - "Le registrazioni restano sul tuo PC"
    - "Nessuna impronta della voce"
    - "Spazio DSA completo"
    - "In italiano e inglese"
  demo:
    bar: "Registrazione in corso · Diritto privato · 00:42:17"
    ascolta: "Si ascolta"
    studia: "Si studia"
    riga: "«Il contratto è l'accordo di due o più parti…»"
    docente: "Docente"
    k1: "Contratto"
    v1: "Accordo tra due o più parti per un rapporto patrimoniale (art. 1321 c.c.)"
    k2: "Requisiti"
    v2: "Accordo, causa, oggetto, forma"
    sintesi: "In sintesi:"
    sv: "senza uno dei 4 requisiti il contratto è nullo."

fa:
  kicker: "Cosa fa"
  h2: "Tutto quello che serve, dall'inizio della lezione al giorno dell'esame"
  p: "Avvii la registrazione e pensi solo ad ascoltare. A lezione finita trovi gli appunti già pronti."
  voci:
    - { ic: "🎙️", t: "Registra audio e video", p: "Lezioni e riunioni su Google Meet, Teams o Zoom: schermo, audio del PC e slide sincronizzati in un solo file." }
    - { ic: "🏫", t: "Anche in aula", p: "Il docente è lì davanti? Verba Manent registra dal microfono del portatile." }
    - { ic: "📝", t: "Trascrive parola per parola", p: "Tutto il parlato diventa testo, direttamente sul tuo computer, in italiano, inglese e altre lingue." }
    - { ic: "📚", t: "Appunti Cornell", p: "Il metodo nato alla [Cornell University](https://lsc.cornell.edu/how-to-study/taking-notes/cornell-note-taking-system/) e usato in tutto il mondo: concetti chiave, spiegazioni e sintesi finale." }
    - { ic: "🎯", t: "Formato Esame", p: "Appunti pensati per ripassare: domande probabili, definizioni da sapere, collegamenti tra gli argomenti." }
    - { ic: "🃏", t: "Flashcard", p: "Le domande e risposte della lezione, pronte per ripassare anche dal telefono." }
    - { ic: "🗣️", t: "Chi parla", p: "Distingue le voci: sai cosa ha detto il docente e cosa hanno chiesto i compagni." }
    - { ic: "💼", t: "Verbale di riunione", p: "Il resoconto scritto della riunione, pronto alla fine: decisioni prese, chi fa cosa ed entro quando. Nessuno deve prendere appunti." }
    - { ic: "🎤", t: "Webinar e corsi", p: "Punti chiave, capitoli e riassunto di webinar e corsi di formazione." }
    - { ic: "📅", t: "Calendario", p: "Collega Google o Outlook: Verba Manent sa quando inizia la lezione e ti ricorda di registrare." }
    - { ic: "📂", t: "Importa quello che hai già", p: "Un video o un audio, un link (Drive, OneDrive, Dropbox, Zoom…) o una trascrizione in PDF o Word: ottieni gli appunti lo stesso." }
    - { ic: "⚡", t: "Pronta subito", p: "Trascrive mentre registri, a pezzi di pochi minuti: a fine lezione gli appunti arrivano in un attimo." }
    - { ic: "☁️", t: "Copia nel cloud, se vuoi", p: "Appena una lezione è pronta, Verba Manent ne mette una copia nel tuo Google Drive o OneDrive: appunti e trascrizione li ritrovi anche dal telefono o da un altro computer." }
    - { ic: "📱", t: "Anche sul telefono", p: "L'app Android registra, trascrive sul telefono e prepara gli stessi appunti del PC." }
    - { ic: "🚀", t: "Trascrizione veloce, se vuoi", p: "PC lento? Collega un tuo server a consumo: un'ora di lezione in circa un minuto, per pochi centesimi. È facoltativo." }
    - { ic: "💬", t: "Chiedi alla lezione", p: "Non hai capito un passaggio? Fai la domanda e la risposta arriva da quello che ha detto il docente." }

dsa:
  kicker: "Per chi ha un DSA"
  h2: "Lo Spazio DSA: tutti gli strumenti compensativi, in un posto solo"
  p: "Dislessia, disgrafia, disortografia, discalculia. Accendi la Modalità DSA e Verba Manent mette in cima quello che ti serve, in ordine: in aula, dopo la lezione, per la verifica e per il docente."
  voci:
    - img: "spazio-dsa"
      t: "Tutto in ordine, al primo colpo"
      p: "Scegli materia e lezione e trovi gli strumenti divisi per momento. Niente menu da cercare: quello che ti serve adesso è già lì."
      punti: ["In aula, dopo la lezione, per la verifica, per il docente", "Si accende con un interruttore", "Le altre funzioni restano a portata di mano in «Altro»"]
      alt: "Lo Spazio DSA di Verba Manent con gli strumenti divisi in: in aula, dopo la lezione, per la verifica."
    - img: "karaoke"
      t: "Il karaoke della lezione"
      p: "Riascolti la voce vera del prof e le parole si illuminano mentre parla, con la slide di quel momento accanto. Tocchi una parola e riparte da lì."
      punti: ["La voce del docente, non una voce sintetica", "«Una riga alla volta» per non perdere il segno", "Velocità da 0,8× a 1,5×"]
      alt: "Il karaoke della lezione: il testo del docente con il lettore audio e la scelta della velocità."
    - img: "come-leggo"
      t: "Come leggo meglio"
      p: "Scegli il carattere (anche OpenDyslexic), la grandezza, lo spazio tra righe e lettere, il colore dello sfondo, le sillabe colorate e il righello di lettura."
      punti: ["Vale per appunti, ascolto, karaoke, flashcard e PDF", "Sfondi tenui: crema, azzurro, verde, rosa", "Anteprima mentre scegli"]
      alt: "La pagina Come leggo meglio con la scelta del carattere, della grandezza e del colore dello sfondo."
    - img: "mappa-verifica"
      t: "La mappa per la verifica"
      p: "Un foglio A4 con le parole chiave delle lezioni che scegli e il riquadro di formule e valori, da stampare e portare alla verifica, con nome e classe in alto."
      punti: ["Solo parole chiave, come chiedono molti docenti", "Togli le parole che non vuoi", "Da far firmare al docente prima della verifica"]
      alt: "La mappa per la verifica: una mappa concettuale su un foglio A4 con nome e classe."
  altri:
    - { ic: "🔊", t: "Ascolta gli appunti", p: "Letti ad alta voce, con la frase che si illumina." }
    - { ic: "🎙️", t: "Scrivi parlando", p: "Detti e il testo si scrive da solo, anche nelle risposte dei test." }
    - { ic: "🎧", t: "Podcast semplice", p: "La lezione in pochi minuti, con frasi corte e la voce del prof nei punti chiave." }
    - { ic: "🃏", t: "Ripasso del giorno", p: "Poche flashcard al giorno, scelte per te fino all'esame, lette anche a voce." }
    - { ic: "📖", t: "Glossario della materia", p: "Le parole difficili spiegate semplici, con la slide e «Senti il prof» dal punto giusto." }
    - { ic: "⏱️", t: "Test con il 30% di tempo in più", p: "Domande lette a voce e tempo in più, come all'esame vero." }
    - { ic: "🎤", t: "Interrogazione a voce", p: "Rispondi parlando, come all'orale, e ricevi il voto con cosa manca." }
    - { ic: "✍️", t: "Scritto dettato", p: "Rispondi a voce: la correzione guarda il contenuto, mai l'ortografia." }
    - { ic: "📋", t: "Il foglio per il PDP", p: "«Gli strumenti che uso»: un PDF con gli strumenti compensativi che usi davvero, da dare alla scuola o all'università." }
  legge_t: "Strumenti previsti dalla legge"
  legge_p: "La legge 170/2010 riconosce il diritto agli strumenti compensativi, come la sintesi vocale e le mappe concettuali. Le linee guida del 2011 (DM 5669) prevedono anche tempo in più nelle prove: all'università di solito fino al 30%. Verba Manent li mette tutti in un programma solo."

nonfa:
  kicker: "Cosa NON fa"
  h2: "Quello che gli altri fanno, e noi no"
  p: "Le tue lezioni e le tue riunioni sono tue. Ecco cosa Verba Manent non farà mai."
  voci:
    - { t: "Non ci manda le tue registrazioni", p: "Audio e video restano sul tuo computer. Noi non li riceviamo e non li conserviamo." }
    - { t: "Non manda l'audio su internet", p: "La trascrizione avviene sul tuo PC o sul telefono. Per creare gli appunti, all'intelligenza artificiale arriva solo il testo. Solo se scegli tu la trascrizione veloce sul tuo server, l'audio va lì e viene cancellato a lavoro finito." }
    - { t: "Non addestra nessuna IA", p: "Le tue lezioni non vengono usate per addestrare l'intelligenza artificiale. Né la nostra, né quella di altri." }
    - { t: "Non registra di nascosto", p: "A ogni registrazione ti propone un messaggio pronto per avvisare i partecipanti." }
  lock_t: "Nessun dato biometrico. Mai."
  lock_p: "“Chi parla” distingue le voci solo mentre lavora, poi cancella ogni traccia. Verba Manent non conserva nessuna impronta della voce."

vetrina:
  kicker: "Punti di forza"
  h2: "Da una lezione o una riunione, tutto questo"
  p: "Registri una volta e Verba Manent ti consegna materiale pronto per studiare o per lavorare. Queste sono schermate vere."
  voci:
    - img: "cornell"
      t: "Appunti Cornell"
      p: "Il metodo di studio più usato al mondo: domande e parole chiave a sinistra, appunti a destra, riassunto in fondo. Con le slide del docente al punto giusto e il minuto della registrazione."
      punti: ["PDF pronto da stampare o leggere sul tablet", "Formulario con simboli e articoli", "«Da controllare» dove l'audio era incerto"]
      alt: "Pagina di appunti in formato Cornell: domande a sinistra, appunti a destra."
    - img: "formato-esame"
      t: "Formato Esame"
      p: "Le domande più probabili, ordinate con le stelle, ognuna con lo schema della risposta, le parole chiave da dire e l'errore da evitare."
      punti: ["★★★ quando il docente ci ha insistito", "Schema della risposta punto per punto", "E se vuoi, un formato descritto da te"]
      alt: "Pagina in Formato Esame con le domande probabili, le stelle e lo schema della risposta."
    - img: "mappa-mentale"
      t: "Mappa mentale"
      p: "Tutta la lezione in un colpo d'occhio: il tema al centro, gli argomenti intorno, i concetti da ricordare su ogni ramo."
      punti: ["Si crea con un tocco dalla lezione", "Da salvare in PDF o stampare", "Perfetta per il ripasso veloce"]
      alt: "Mappa mentale della lezione sul contratto, con sei rami colorati."
    - img: "infografica"
      t: "Infografica in una pagina"
      p: "I concetti chiave in grande, i passi da seguire, l'attenzione da tenere all'esame e la lezione in numeri. Una pagina sola, da tenere sulla scrivania."
      punti: ["Il concetto più importante evidenziato", "Passi e trappole d'esame", "Salvabile in PDF"]
      alt: "Infografica della lezione: concetti chiave, passi, attenzione e numeri."
    - img: "flashcard"
      t: "Flashcard e Ripassa"
      p: "Le domande della lezione diventano carte da girare. Dici «La sapevo» o «Da rivedere» e quelle sbagliate tornano finché non le sai."
      punti: ["Prima quelle da rivedere, poi le altre", "Anche dal telefono", "Ripassi tutta la materia, non solo una lezione"]
      alt: "Il ripasso con le flashcard: la domanda, «Da rivedere» e «La sapevo»."
    - img: "domande-esame"
      t: "Preparati all'esame"
      p: "Le domande più probabili di tutto il corso, con le lezioni in cui sono state spiegate, e un piano di studio giorno per giorno fino all'esame."
      punti: ["Classifica delle domande del corso", "Piano di studio da mettere in calendario", "Si aggiorna a ogni lezione nuova"]
      alt: "Le domande più probabili del corso e il piano di studio fino all'esame."
    - img: "simulazione-esame"
      t: "Simulazione d'esame con il voto"
      p: "Rispondi per iscritto come all'esame vero: ogni risposta riceve un punteggio, cosa hai detto bene e cosa manca. Alla fine il voto."
      punti: ["Punteggio per ogni domanda", "Cosa manca nella tua risposta", "I voti restano: vedi se migliori"]
      alt: "Simulazione d'esame con le risposte scritte e il punteggio di ognuna."
    - img: "chiedi"
      t: "Le tue note, al minuto giusto"
      p: "Durante la lezione scrivi due parole o tocchi «Importante», «Da chiarire», «Cosa da fare»: la nota prende il minuto esatto e Claude la usa negli appunti. E se ti sei perso, chiedi «di cosa sta parlando?»."
      punti: ["Una stella nel momento che conta", "I tuoi dubbi finiscono negli appunti", "«Chiedi adesso» mentre registri"]
      alt: "Le note scritte durante la registrazione, ognuna con il suo minuto."
    - img: "chi-parla"
      t: "Trascrizione con chi parla"
      p: "Tutto il parlato, parola per parola, con il nome di chi parla e il minuto. Cerchi una parola e ascolti il punto esatto."
      punti: ["Voci separate, i nomi li dai tu", "Capitoli e ricerca nelle parole dette", "Spezzoni audio da inviare"]
      alt: "Trascrizione di una riunione con i nomi di chi parla e i minuti."
    - img: "verbale"
      t: "Il verbale della riunione, scritto da solo"
      p: "Il verbale è il resoconto scritto di una riunione. Registri la riunione (su Meet, Teams, Zoom o in sala) e alla fine Verba Manent te lo consegna già scritto: cosa si è deciso, chi deve fare cosa ed entro quando, cosa resta in sospeso e quando ci si rivede. Nessuno deve più prendere appunti."
      punti: ["Pronto a fine riunione, in PDF", "Da mandare ai partecipanti con un tocco: email, Word, Google Docs", "Su misura: riunione commerciale, di condominio, colloquio…"]
      alt: "Verbale di riunione con in breve, decisioni e la tabella delle cose da fare."
    - img: "cose-da-fare"
      t: "Cose da fare, da tutti i verbali"
      p: "Gli impegni presi in ogni riunione finiscono in un unico elenco, con chi e entro quando. Alla riunione dopo si spuntano da soli quando qualcuno dice che sono fatti."
      punti: ["Filtri per persona e stato", "Scadenze in calendario", "Si spuntano dal verbale successivo"]
      alt: "L'elenco delle cose da fare raccolte dai verbali."
    - img: "riunione-ripresa"
      t: "Ogni riunione riparte dall'ultima"
      p: "Quando inizi una riunione, Verba Manent ricorda le cose ancora aperte dalla volta prima. Se oggi qualcuno dice che sono fatte, nel verbale risultano chiuse."
      punti: ["Le cose aperte sempre sotto gli occhi", "Si chiudono da sole quando sono fatte", "Il verbale dice cosa è cambiato"]
      alt: "Riquadro «Dall'ultima volta» con le cose ancora aperte all'inizio di una riunione."

inpiu:
  kicker: "E in più"
  h2: "Rispettoso e comodo"
  p: "Le attenzioni che fanno la differenza, per te e per chi registri."
  voci:
    - img: "avvisa"
      t: "Avvisa i partecipanti, in un tocco"
      p: "A ogni registrazione Verba Manent ti propone un messaggio pronto: lo copi nella chat di Meet, Teams o Zoom, oppure lo leggi a voce in aula. Quando premi «Fatto, ho avvisato», l'ora resta annotata nella registrazione."
      punti: ["Messaggio diverso per lezione, riunione, webinar e aula", "In italiano o in inglese, nella lingua della lezione", "L'ora dell'avviso resta con la registrazione"]
      alt: "Il riquadro «Avvisa i partecipanti» durante una registrazione, con il messaggio pronto da copiare."
    - img: "prima-di-iniziare"
      t: "La privacy spiegata chiara, prima di cominciare"
      p: "Al primo avvio un riquadro dice in quattro righe cosa resta sul tuo computer e cosa esce, e ti chiede di confermare che hai il permesso di registrare. Niente caratteri piccoli: lo rileggi quando vuoi in Impostazioni."
      punti: ["Le registrazioni restano sul tuo computer", "Nessuna impronta della voce, mai", "Rapporti sugli errori solo se dici di sì, senza i tuoi contenuti"]
      alt: "Il riquadro «Prima di iniziare» con i punti sulla privacy e la casella sul permesso di registrare."
    - img: "importa"
      t: "Hai già la lezione? Importala"
      p: "Non serve registrare tutto da zero. Importi un video o un audio dal PC, un link di Drive, OneDrive, Dropbox o Zoom, oppure una trascrizione in PDF o Word: Verba Manent ne fa appunti, flashcard e domande d'esame."
      punti: ["Video e audio: mp4, mov, mp3, m4a, note vocali…", "Link alle registrazioni già online", "Trascrizioni in PDF, Word o testo"]
      alt: "La schermata Registra con i riquadri per importare un video, un audio o una trascrizione."
    - img: "dove-trascrivo"
      t: "Veloce anche su un PC lento"
      p: "Di serie trascrive sul tuo PC, gratis, e l'audio non esce mai. Se il computer è lento puoi scegliere un tuo server di trascrizione a consumo: un'ora di lezione in circa un minuto, e l'audio viene cancellato a lavoro finito."
      punti: ["Sul PC: gratis e senza internet", "Sul server: pochi centesimi l'ora, solo se lo scegli", "Se il server non risponde, si torna al PC da soli"]
      alt: "Le impostazioni «Dove trascrivo» con le scelte Sul PC e Sul server."
    - img: "telefono"
      t: "Anche sul telefono Android"
      p: "Le stesse funzioni del PC, in tasca: registri in aula o in riunione, avvisi i presenti, scrivi le tue note durante la lezione e ritrovi appunti, flashcard e domande d'esame in «Le mie lezioni»."
      punti: ["Trascrizione sul telefono", "Avviso a voce per l'aula", "Appunti, ripasso e preparazione all'esame"]
      alt: "Tre schermate dell'app Android: Registra, una registrazione in corso e Le mie lezioni."

come:
  kicker: "Come funziona"
  h2: "Tre passi, nessuna fatica"
  p: "Premi play: sono i video della guida dentro il programma. Alla fine di uno parte da solo il successivo."
  avvia: "Avvia il video"
  schermo: "Schermo intero"
  passi:
    - { v: "registrare", t: "Premi Registra", p: "Scegli lezione, riunione o webinar, online o in aula, e la lingua di chi parla." }
    - { v: "durante", t: "Ascolta tranquillo", p: "Verba Manent registra e trascrive mentre segui, a pezzi di pochi minuti: gli appunti sono pronti poco dopo la fine." }
    - { v: "fine", t: "Studia gli appunti", p: "A fine lezione hai appunti ordinati in PDF, con slide, sintesi e domande per il ripasso." }

chi:
  kicker: "Per chi"
  h2: "Nato per gli studenti, utile a chiunque passi le giornate in riunione"
  studenti:
    tag: "🎓 Studenti"
    t: "Segui la lezione, non la penna"
    voci: ["Lezioni online e in aula", "Appunti Cornell e Formato Esame", "Flashcard e domande sulla lezione", "Slide del docente dentro gli appunti"]
  pro:
    tag: "💼 Professionisti"
    t: "Il verbale si scrive da solo"
    voci: ["Riunioni su Meet, Teams e Zoom", "Decisioni e cose da fare con scadenze", "Chi ha detto cosa", "Pronto da condividere con il team"]
  disponibile: "Disponibile per"
  ok: "Disponibile"
  presto: "In arrivo"
  web: "Web"
  web_t: "Anche dal browser, su qualsiasi computer"
  web_p: "Apri le tue lezioni su verbamanent.app/studia: accedi con Google e la password di Sincronizza. Appunti, karaoke, flashcard e ripasso, senza installare niente; il ripasso fatto sul web torna sul PC e sul telefono."
  web_b: "Apri Verba Manent sul web →"

attesa:
  h2: "Vuoi essere tra i primi?"
  p: "Lasciaci la tua email: ti avvisiamo appena Verba Manent è disponibile."
  email: "La tua email"
  uso: ["Lo userei per: studiare", "Lo userei per: lavoro e riunioni", "Lo userei per: tutti e due"]
  bottone: "Avvisami"
  nota: "Nessuna pubblicità: una sola email quando esce. Puoi cancellarti quando vuoi."
  grazie: "Fatto! Ti scriveremo una sola volta, quando Verba Manent è disponibile."
  errore: "Non è andata: controlla l'email e riprova tra poco."
  privacy: "Come trattiamo la tua email"

domande:
  kicker: "Domande"
  h2: "Domande frequenti"
  voci:
    - { q: "Posso registrare qualsiasi lezione?", a: "Dipende dalla tua università e dal docente: molte università hanno regole sulla registrazione delle lezioni. Verba Manent te lo ricorda, ma il permesso devi averlo tu." }
    - { q: "Serve internet?", a: "Per registrare e trascrivere no: avviene tutto sul tuo PC o sul telefono. Per creare gli appunti sì, perché il testo viene elaborato dall'intelligenza artificiale." }
    - { q: "Funziona anche sul telefono?", a: "Sì, su Android: registra dal microfono (anche le lezioni online, col vivavoce), trascrive sul telefono e prepara gli stessi appunti del PC. Le versioni per Mac e iPhone sono in arrivo." }
    - { q: "Il mio PC è lento: la trascrizione ci mette tanto?", a: "Di serie trascrive mentre registri, quindi a fine lezione manca poco. Se vuoi ancora più velocità puoi collegare un tuo server di trascrizione a consumo (pochi centesimi l'ora): un'ora di lezione in circa un minuto. È facoltativo e, se il server non risponde, si torna a trascrivere sul PC." }
    - { q: "Dove finiscono le mie registrazioni?", a: "In una cartella del tuo computer, scelta da te. Noi non le vediamo mai." }
    - { q: "Riconosce le persone dalla voce?", a: "No. Distingue le voci solo dentro la stessa registrazione e a fine lavoro cancella ogni traccia della voce. I nomi alle voci li dai tu." }
    - { q: "Quanto costa?", a: "Lo diremo al lancio: chi è nella lista d'attesa lo saprà per primo." }

