        - ["Trascrive sul tuo dispositivo, gratis e senza internet", "✓", "non dichiarato", "✓", "non dichiarato", "—"]
        - ["Riconosce chi parla", "✓", "non dichiarato", "✓ nelle riunioni", "—", "—"]
        - ["Foto alla lavagna agganciata al minuto della lezione", "✓", "foto nelle note", "foto nelle note", "—", "—"]
        - ["Importa video, audio, link YouTube e trascrizioni", "✓", "✓ YouTube", "—", "✓", "✓"]
    - t: "Dopo la lezione"
      righe:
        - ["Appunti Cornell e Formato Esame, con le slide accanto", "✓", "riassunto", "riassunto", "note", "riassunto"]
        - ["Chiedi alla lezione, con slide e minuto", "✓", "✓ chat", "✓ chat", "✓ chat", "✓ con citazioni"]
        - ["Podcast della lezione con la voce vera del prof", "✓ una voce, due voci, dibattito", "—", "—", "voci sintetiche", "voci sintetiche"]
        - ["Riascolto sincronizzato (Karaoke) con la slide", "✓", "✓ con i tuoi appunti a mano", "—", "—", "—"]
        - ["Mappa mentale e infografica", "✓", "—", "—", "—", "✓"]
