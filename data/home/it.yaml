hero:
  pill: "🎓 L'app per prendere appunti, per chi studia e per chi lavora"
  h1a: "Le parole volano."
  h1b: "Gli appunti restano."
  lead: "Verba Manent registra la lezione, la sbobina e la trasforma in appunti ordinati, pronti per studiare. Tu ascolti, al resto pensa lui."
  cta1: "Avvisami quando esce"
  cta2: "Guarda come funziona"
  trust:
    - "Le registrazioni restano sul tuo PC"
    - "Nessuna impronta della voce"
    - "In italiano e inglese"
  demo:
    bar: "Registrazione in corso · Diritto privato · 00:42:17"
    ascolta: "Si ascolta"
    studia: "Si studia"
    riga: "«Il contratto è l'accordo di due o più parti…»"
    docente: "Docente"
    k1: "Contratto"
    v1: "Accordo tra due o più parti per un rapporto patrimoniale (art. 1321 c.c.)"
    k2: "Requisiti"
    v2: "Accordo, causa, oggetto, forma"
    sintesi: "In sintesi:"
    sv: "senza uno dei 4 requisiti il contratto è nullo."

fa:
  kicker: "Cosa fa"
  h2: "Tutto quello che serve, dall'inizio della lezione al giorno dell'esame"
  p: "Avvii la registrazione e pensi solo ad ascoltare. A lezione finita trovi gli appunti già pronti."
  voci:
    - { ic: "🎙️", t: "Registra audio e video", p: "Lezioni e riunioni su Google Meet, Teams o Zoom: schermo, audio del PC e slide sincronizzati in un solo file." }
    - { ic: "🏫", t: "Anche in aula", p: "Il docente è lì davanti? Verba Manent registra dal microfono del portatile." }
    - { ic: "📝", t: "Trascrive parola per parola", p: "Tutto il parlato diventa testo, direttamente sul tuo computer, in italiano, inglese e altre lingue." }
    - { ic: "📚", t: "Appunti Cornell", p: "Il metodo nato alla [Cornell University](https://lsc.cornell.edu/how-to-study/taking-notes/cornell-note-taking-system/) e usato in tutto il mondo: concetti chiave, spiegazioni e sintesi finale." }
    - { ic: "🎯", t: "Formato Esame", p: "Appunti pensati per ripassare: domande probabili, definizioni da sapere, collegamenti tra gli argomenti." }
    - { ic: "🃏", t: "Flashcard", p: "Le domande e risposte della lezione, pronte per ripassare anche dal telefono." }
    - { ic: "🗣️", t: "Chi parla", p: "Distingue le voci: sai cosa ha detto il docente e cosa hanno chiesto i compagni." }
    - { ic: "💼", t: "Verbale di riunione", p: "Decisioni prese, cose da fare, chi le fa ed entro quando. Pronto da inviare." }
    - { ic: "🎤", t: "Webinar e corsi", p: "Punti chiave, capitoli e riassunto di webinar e corsi di formazione." }
    - { ic: "📅", t: "Calendario", p: "Collega Google o Outlook: Verba Manent sa quando inizia la lezione e ti ricorda di registrare." }
    - { ic: "📂", t: "Importa quello che hai già", p: "Un video o un audio, un link (Drive, OneDrive, Dropbox, Zoom…) o una trascrizione in PDF o Word: ottieni gli appunti lo stesso." }
    - { ic: "⚡", t: "Pronta subito", p: "Trascrive mentre registri, a pezzi di pochi minuti: a fine lezione gli appunti arrivano in un attimo." }
    - { ic: "📱", t: "Anche sul telefono", p: "L'app Android registra, trascrive sul telefono e prepara gli stessi appunti del PC." }
    - { ic: "🚀", t: "Trascrizione veloce, se vuoi", p: "PC lento? Collega un tuo server a consumo: un'ora di lezione in circa un minuto, per pochi centesimi. È facoltativo." }
    - { ic: "💬", t: "Chiedi alla lezione", p: "Non hai capito un passaggio? Fai la domanda e la risposta arriva da quello che ha detto il docente." }

nonfa:
  kicker: "Cosa NON fa"
  h2: "Quello che gli altri fanno, e noi no"
  p: "Le tue lezioni e le tue riunioni sono tue. Ecco cosa Verba Manent non farà mai."
  voci:
    - { t: "Non ci manda le tue registrazioni", p: "Audio e video restano sul tuo computer. Noi non li riceviamo e non li conserviamo." }
    - { t: "Non manda l'audio su internet", p: "La trascrizione avviene sul tuo PC o sul telefono. Per creare gli appunti, all'intelligenza artificiale arriva solo il testo. Solo se scegli tu la trascrizione veloce sul tuo server, l'audio va lì e viene cancellato a lavoro finito." }
    - { t: "Non addestra nessuna IA", p: "Le tue lezioni non vengono usate per addestrare l'intelligenza artificiale. Né la nostra, né quella di altri." }
    - { t: "Non registra di nascosto", p: "A ogni registrazione ti propone un messaggio pronto per avvisare i partecipanti." }
  lock_t: "Nessun dato biometrico. Mai."
  lock_p: "“Chi parla” distingue le voci solo mentre lavora, poi cancella ogni traccia. Verba Manent non conserva nessuna impronta della voce."

vetrina:
  kicker: "Punti di forza"
  h2: "Fatto con rispetto, per chi registra e per chi viene registrato"
  p: "Le cose che fanno la differenza, viste dal vero dentro il programma."
  voci:
    - img: "avvisa"
      t: "Avvisa i partecipanti, in un tocco"
      p: "A ogni registrazione Verba Manent ti propone un messaggio pronto: lo copi nella chat di Meet, Teams o Zoom, oppure lo leggi a voce in aula. Quando premi «Fatto, ho avvisato», l'ora resta annotata nella registrazione."
      punti: ["Messaggio diverso per lezione, riunione, webinar e aula", "In italiano o in inglese, nella lingua della lezione", "L'ora dell'avviso resta con la registrazione"]
      alt: "Il riquadro «Avvisa i partecipanti» durante una registrazione, con il messaggio pronto da copiare."
    - img: "prima-di-iniziare"
      t: "La privacy spiegata chiara, prima di cominciare"
      p: "Al primo avvio un riquadro dice in quattro righe cosa resta sul tuo computer e cosa esce, e ti chiede di confermare che hai il permesso di registrare. Niente caratteri piccoli: lo rileggi quando vuoi in Impostazioni."
      punti: ["Le registrazioni restano sul tuo computer", "Nessuna impronta della voce, mai", "Rapporti sugli errori solo se dici di sì, senza i tuoi contenuti"]
      alt: "Il riquadro «Prima di iniziare» con i punti sulla privacy e la casella sul permesso di registrare."
    - img: "importa"
      t: "Hai già la lezione? Importala"
      p: "Non serve registrare tutto da zero. Importi un video o un audio dal PC, un link di Drive, OneDrive, Dropbox o Zoom, oppure una trascrizione in PDF o Word: Verba Manent ne fa appunti, flashcard e domande d'esame."
      punti: ["Video e audio: mp4, mov, mp3, m4a, note vocali…", "Link alle registrazioni già online", "Trascrizioni in PDF, Word o testo"]
      alt: "La schermata Registra con i riquadri per importare un video, un audio o una trascrizione."
    - img: "dove-trascrivo"
      t: "Veloce anche su un PC lento"
      p: "Di serie trascrive sul tuo PC, gratis, e l'audio non esce mai. Se il computer è lento puoi scegliere un tuo server di trascrizione a consumo: un'ora di lezione in circa un minuto, e l'audio viene cancellato a lavoro finito."
      punti: ["Sul PC: gratis e senza internet", "Sul server: pochi centesimi l'ora, solo se lo scegli", "Se il server non risponde, si torna al PC da soli"]
      alt: "Le impostazioni «Dove trascrivo» con le scelte Sul PC e Sul server."
    - img: "telefono"
      t: "Anche sul telefono Android"
      p: "Le stesse funzioni del PC, in tasca: registri in aula o in riunione, avvisi i presenti, scrivi le tue note durante la lezione e ritrovi appunti, flashcard e domande d'esame in «Le mie lezioni»."
      punti: ["Trascrizione sul telefono", "Avviso a voce per l'aula", "Appunti, ripasso e preparazione all'esame"]
      alt: "Tre schermate dell'app Android: Registra, una registrazione in corso e Le mie lezioni."

come:
  kicker: "Come funziona"
  h2: "Tre passi, nessuna fatica"
  p: "Premi play: sono i video della guida dentro il programma. Alla fine di uno parte da solo il successivo."
  avvia: "Avvia il video"
  schermo: "Schermo intero"
  passi:
    - { v: "registrare", t: "Premi Registra", p: "Scegli lezione, riunione o webinar, online o in aula, e la lingua di chi parla." }
    - { v: "durante", t: "Ascolta tranquillo", p: "Verba Manent registra e trascrive mentre segui, a pezzi di pochi minuti: gli appunti sono pronti poco dopo la fine." }
    - { v: "fine", t: "Studia gli appunti", p: "A fine lezione hai appunti ordinati in PDF, con slide, sintesi e domande per il ripasso." }

chi:
  kicker: "Per chi"
  h2: "Nato per gli studenti, utile a chiunque passi le giornate in riunione"
  studenti:
    tag: "🎓 Studenti"
    t: "Segui la lezione, non la penna"
