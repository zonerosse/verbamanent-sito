    t: "Il verbale si scrive da solo"
    voci: ["Riunioni su Meet, Teams e Zoom", "Decisioni e cose da fare con scadenze", "Chi ha detto cosa", "Pronto da condividere con il team"]
  disponibile: "Disponibile per"
  ok: "Disponibile"
  presto: "In arrivo"

attesa:
  h2: "Vuoi essere tra i primi?"
  p: "Lasciaci la tua email: ti avvisiamo appena Verba Manent è disponibile."
  email: "La tua email"
  uso: ["Lo userei per: studiare", "Lo userei per: lavoro e riunioni", "Lo userei per: tutti e due"]
  bottone: "Avvisami"
  nota: "Nessuna pubblicità: una sola email quando esce. Puoi cancellarti quando vuoi."
  grazie: "Fatto! Ti scriveremo una sola volta, quando Verba Manent è disponibile."
  errore: "Non è andata: controlla l'email e riprova tra poco."
  privacy: "Come trattiamo la tua email"

domande:
  kicker: "Domande"
  h2: "Domande frequenti"
  voci:
    - { q: "Posso registrare qualsiasi lezione?", a: "Dipende dalla tua università e dal docente: molte università hanno regole sulla registrazione delle lezioni. Verba Manent te lo ricorda, ma il permesso devi averlo tu." }
    - { q: "Serve internet?", a: "Per registrare e trascrivere no: avviene tutto sul tuo PC o sul telefono. Per creare gli appunti sì, perché il testo viene elaborato dall'intelligenza artificiale." }
    - { q: "Funziona anche sul telefono?", a: "Sì, su Android: registra dal microfono (anche le lezioni online, col vivavoce), trascrive sul telefono e prepara gli stessi appunti del PC. Le versioni per Mac e iPhone sono in arrivo." }
    - { q: "Il mio PC è lento: la trascrizione ci mette tanto?", a: "Di serie trascrive mentre registri, quindi a fine lezione manca poco. Se vuoi ancora più velocità puoi collegare un tuo server di trascrizione a consumo (pochi centesimi l'ora): un'ora di lezione in circa un minuto. È facoltativo e, se il server non risponde, si torna a trascrivere sul PC." }
    - { q: "Dove finiscono le mie registrazioni?", a: "In una cartella del tuo computer, scelta da te. Noi non le vediamo mai." }
    - { q: "Riconosce le persone dalla voce?", a: "No. Distingue le voci solo dentro la stessa registrazione e a fine lavoro cancella ogni traccia della voce. I nomi alle voci li dai tu." }
    - { q: "Quanto costa?", a: "Lo diremo al lancio: chi è nella lista d'attesa lo saprà per primo." }

