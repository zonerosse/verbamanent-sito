hero:
  pill: "🎓 From the lecture to the exam"
  h1a: "Words fly away."
  h1b: "Notes remain."
  lead: "It records the lecture, gives you the notes and takes you all the way to the exam: with the lecturer's real voice, a tutor that knows when your exam is and the tools for dyslexic students. Everything stays on your device."
  cta1: "Notify me at launch"
  cta2: "See how it works"
  trust:
    - "Recordings stay on your computer"
    - "No voiceprints"
    - "Complete DSA space"
    - "In English and Italian"
  demo:
    bar: "Recording · Contract Law · 00:42:17"
    ascolta: "You listen"
    studia: "You study"
    riga: "“A contract is an agreement between two or more parties…”"
    docente: "Lecturer"
    k1: "Contract"
    v1: "A legally binding agreement between two or more parties"
    k2: "Elements"
    v2: "Offer, acceptance, consideration, intention"
    sintesi: "In short:"
    sv: "without all four elements there is no valid contract."

fa:
  kicker: "Features"
  h2: "Everything you need, from the first minute of class to exam day"
  p: "Start recording and just listen. When the lecture ends, your notes are ready."
  voci:
    - { ic: "🎙️", t: "Records audio and video", p: "Lectures and meetings on Google Meet, Teams or Zoom: screen, computer audio and slides in sync, in a single file." }
    - { ic: "🏫", t: "In the classroom too", p: "Lecturer right in front of you? Verba Manent records through your laptop microphone." }
    - { ic: "📝", t: "Word-for-word transcript", p: "Everything that is said becomes text, right on your computer, in English, Italian and other languages." }
    - { ic: "📚", t: "Cornell notes", p: "The method born at [Cornell University](https://lsc.cornell.edu/how-to-study/taking-notes/cornell-note-taking-system/) and used worldwide: key ideas, explanations and a final summary." }
    - { ic: "🎯", t: "Exam Format", p: "Notes built for revision: likely questions, definitions to know, links between topics." }
    - { ic: "🃏", t: "Flashcards", p: "Questions and answers from the lecture, ready for revision, even on your phone." }
    - { ic: "🗣️", t: "Who's speaking", p: "Tells voices apart: you know what the lecturer said and what your classmates asked." }
    - { ic: "💼", t: "Meeting minutes", p: "The written record of the meeting, ready at the end: decisions made, who does what and by when. Nobody has to take notes." }
    - { ic: "🎤", t: "Webinars and courses", p: "Key points, chapters and a summary of webinars and training courses." }
    - { ic: "📅", t: "Calendar", p: "Connect Google or Outlook: Verba Manent knows when class starts and reminds you to record." }
    - { ic: "📂", t: "Import what you already have", p: "A video or audio file, a link (Drive, OneDrive, Dropbox, Zoom…) or a transcript in PDF or Word: you still get your notes." }
    - { ic: "⚡", t: "Ready right away", p: "It transcribes while you record, a few minutes at a time: when the lecture ends, your notes arrive in moments." }
    - { ic: "☁️", t: "Cloud copy, if you want", p: "As soon as a lecture is ready, Verba Manent puts a copy in your Google Drive (just connect your account, nothing to install) or OneDrive: you find notes and transcript from your phone or another computer too." }
    - { ic: "📱", t: "On your phone too", p: "The Android and iPhone app records, transcribes on the phone and prepares the same notes as the PC." }
    - { ic: "🚀", t: "Fast transcription, if you want", p: "Slow PC? Connect your own pay-as-you-go server: an hour of lecture in about a minute, for a few cents. It's optional." }
    - { ic: "💬", t: "Ask the lecture", p: "Missed a point? Ask your question and the answer comes from what the lecturer actually said." }
    - { ic: "🔎", t: "Search, and find it at once", p: "Type a word in «Search»: you get the feature with the path to reach it, the guide chapter and the lectures where it was mentioned." }

sm:
  kicker: "For students with dyslexia"
  h2: "Scripta Manent: the study app for students with dyslexia"
  p: "Dyslexia, dysgraphia, dysorthographia, dyscalculia. Scripta Manent records the lecture and makes it easy to read and to listen to. Then it helps you with homework, maths and all the way to the test. It is the sister app of Verba Manent IA, made just for students."
  dove: ["Windows", "Android", "iPhone", "Web", "Inside Verba Manent IA: «DSA space»", "Mac coming soon"]
  web_b: "Open Scripta Manent on the web"
  video: { v: "sm-casa", img: "sm-casa-en", k: "Every day", h2: "My tools: it always opens here", testo: "How many things you have to do today, in order: homework and review. The upcoming test with the days left. The last lesson to listen to, with the map and the flashcards. Below, all the tools divided by moment.", punti: ["To do today: start from the first and go on", "Upcoming test: «Review today»", "Every explanation can also be read aloud, with the (i)"] }
  voci:
    - img: "sm-ascolta-en"
      t: "Listen and Karaoke"
      p: "The notes read aloud, with the sentence you hear lighting up. In Karaoke the teacher speaks, with their real voice, one line at a time."
      punti: ["Slower or faster", "Easy notes: questions, keywords, slides", "Tap a chapter and hear the teacher from there"]
      alt: "Scripta Manent reads the notes aloud and highlights the sentence you hear."
    - img: "sm-compiti-en"
      t: "Homework: take a photo of your planner"
      p: "One photo of your planner and the homework is sorted by day. It also arrives by itself from the lessons: when the teacher sets homework, Scripta Manent finds it."
      punti: ["Understand: what it asks, in simple words", "Do it: split into small pieces, with the time", "Remind me, Done, Move"]
      alt: "The Homework page with the week, the day's homework and the task card split into pieces."
    - img: "sm-mate-en"
      t: "Maths"
      p: "The calculator that talks and reads the calculation back, times tables aloud, the formula sheet and the problem split into small steps. Take a photo of your working and it tells you if the result is right."
      punti: ["Formulas for shapes and those from your lessons", "Problem step by step, with «Ask about this step»", "Fractions to see, percentages, converter"]
      alt: "Scripta Manent maths with the talking calculator."
    - img: "sm-verifica-en"
      t: "The test: the plan, day by day"
      p: "Mark the test and choose what it covers: lessons and textbook pages. Scripta Manent makes the plan with the minutes a day you choose and reminds you every day of today's piece."
      punti: ["Multiple-choice tests and spoken oral test", "The questions you get wrong come back sooner", "Take a photo of the marked test and understand the mistakes"]
      alt: "The test plan with the minutes a day and the days of the week."
  inpiu_t: "And everything else you need"
  gruppi:
    - t: "Lesson"
      voci: [{t: "Record with «I didn't get it» and «Important»"}, {t: "Write by speaking"}, {t: "Map, flashcards and Daily review"}, {t: "Read it to me: books and PDFs aloud"}]
    - t: "Homework"
      voci: [{t: "One task at a time, in small steps"}, {t: "Gentle spell-checker"}, {t: "Easy languages"}, {t: "Font, spacing and background as you like"}]
    - t: "Tests and family"
      voci: [{t: "Tests and spoken oral test, 30% extra time"}, {t: "Test map and learning plan sheet"}, {t: "The week for parents"}, {t: "19% tax deduction (Italy)"}]
  vs:
    - { t: "Verba Manent IA", c: "vm", p: "is for university, work and meetings." }
    - { t: "Scripta Manent", c: "sm", p: "is for students with dyslexia. In Verba Manent IA you find all of it in the «DSA space»." }
  legge_t: "Tools provided for by law"
  legge_p: "In Italy, law 170/2010 recognises the right to assistive tools, such as text-to-speech and concept maps. The 2011 guidelines (DM 5669) also provide extra time in tests: usually up to 30%. Scripta Manent puts them all in one program."

nonfa:
  kicker: "What it won't do"
  h2: "What others do, and we don't"
  p: "Your lectures and meetings belong to you. Here is what Verba Manent will never do."
  voci:
    - { t: "It never sends us your recordings", p: "Audio and video stay on your computer. We don't receive them and we don't keep them." }
    - { t: "It never sends audio over the internet", p: "Transcription happens on your computer or phone. To create your notes, the AI only receives text. Only if you choose fast transcription on your own server does the audio go there, and it is deleted when the work is done." }
    - { t: "It never trains any AI", p: "Your lectures are never used to train artificial intelligence. Not ours, not anyone else's." }
    - { t: "It never records in secret", p: "Every time you record, it offers a ready-made message to let the other participants know." }
  lock_t: "No biometric data. Ever."
  lock_p: "“Who's speaking” tells voices apart only while it works, then deletes every trace. Verba Manent keeps no voiceprint."

vetrina:
  kicker: "Highlights"
  h2: "From one lecture or meeting, all of this"
  p: "Record once and Verba Manent hands you material ready for studying or working. These are real screenshots."
  voci:
    - img: "cornell-en"
      t: "Cornell notes"
      p: "The world's most widely used study method: questions and keywords on the left, notes on the right, summary at the bottom. With the lecturer's slides in the right place and the minute of the recording."
      punti: ["PDF ready to print or read on a tablet", "Formula sheet with symbols and articles", "«To check» where the audio was unclear"]
      alt: "A page of Cornell notes: questions on the left, notes on the right."
    - img: "formato-esame-en"
      t: "Exam-ready format"
      p: "The most likely questions, ranked with stars, each with an answer outline, the keywords to mention and the mistake to avoid."
      punti: ["★★★ when the lecturer insisted on it", "Answer outline point by point", "And if you like, a format you describe yourself"]
      alt: "Exam-ready page with likely questions, stars and answer outlines."
    - img: "mappa-mentale-en"
      t: "Mind map"
      p: "The whole lecture at a glance: the topic in the centre, the subjects around it, the concepts to remember on each branch."
      punti: ["Created from the lecture in one tap", "Change it or build it yourself, by voice too", "Perfect for quick review"]
      alt: "Mind map of the lecture on contracts, with six coloured branches."
    - img: "infografica-en"
      t: "One-page infographic"
      p: "The key concepts in large type, the steps to follow, what to watch out for in the exam and the lecture in numbers. A single page to keep on your desk."
      punti: ["The most important concept highlighted", "Steps and exam traps", "Save as PDF"]
      alt: "Lecture infographic: key concepts, steps, warnings and numbers."
    - img: "flashcard-en"
      t: "Flashcards and review"
      p: "The lecture's questions become cards to flip. You say «I knew it» or «Review again», and the ones you miss come back until you know them."
      punti: ["The ones to review first, then the rest", "On your phone too", "Review the whole subject, not just one lecture"]
      alt: "Reviewing with flashcards: the question, «Review again» and «I knew it»."
    - img: "domande-esame-en"
      t: "Get ready for the exam"
      p: "The most likely questions of the whole course, with the lectures where they were explained, and a day-by-day study plan up to the exam."
      punti: ["Ranking of the course's questions", "Study plan to put in your calendar", "Updated with every new lecture"]
      alt: "The course's most likely questions and the study plan up to the exam."
    - img: "simulazione-esame-en"
      t: "Mock exam with a grade"
      p: "Answer in writing as in the real exam: each answer gets a score, what you got right and what's missing. A grade at the end."
      punti: ["Score for every question", "What your answer is missing", "Grades are kept: see if you improve"]
      alt: "Mock exam with written answers and the score for each."
    - img: "chiedi-en"
      t: "Your notes, at the right minute"
      p: "During the lecture type a couple of words or tap «Important», «To clarify», «To do»: the note takes the exact minute and Claude uses it in your notes. And if you lose the thread, ask «what are they talking about?»."
      punti: ["A star at the moment that matters", "Your doubts end up in your notes", "«Ask now» while recording"]
      alt: "Notes written during the recording, each with its minute."
    - img: "chi-parla-en"
      t: "Transcript with who's speaking"
      p: "Every word, with the name of who said it and the minute. Search for a word and listen to the exact moment."
      punti: ["Voices kept apart, you choose the names", "Chapters and search in what was said", "Audio clips to send"]
      alt: "Meeting transcript with speaker names and minutes."
    - img: "verbale-en"
      t: "Meeting minutes that write themselves"
      p: "Minutes are the written record of a meeting. Record the meeting (on Meet, Teams, Zoom or in the room) and at the end Verba Manent hands them to you already written: what was decided, who has to do what and by when, what's still open and when you meet next. Nobody has to take notes anymore."
      punti: ["Ready when the meeting ends, as a PDF", "Send them to participants in one tap: email, Word, Google Docs", "Tailored: sales meeting, residents' association, interview…"]
      alt: "Meeting minutes with summary, decisions and the action items table."
    - img: "cose-da-fare-en"
      t: "Action items from all your minutes"
      p: "The commitments made in every meeting end up in one list, with owners and deadlines. At the next meeting they tick themselves off when someone says they're done."
      punti: ["Filters by person and status", "Deadlines in your calendar", "Ticked off by the next minutes"]
      alt: "The list of action items gathered from the minutes."
    - img: "riunione-ripresa"
      t: "Every meeting picks up from the last"
      p: "When you start a meeting, Verba Manent recalls what was still open from last time. If someone says today that it's done, the minutes show it as closed."
      punti: ["Open items always in view", "They close themselves when done", "The minutes say what changed"]
      alt: "The «Since last time» box with open items at the start of a meeting."
    - img: "andamento-en"
      t: "Progress: how you're doing"
      p: "One page to see where you stand: hours recorded week by week, days left to each exam, test scores, your review streak and what is still to fix."
      punti: ["Upcoming exams with how much of the study plan is done", "Test scores subject by subject", "For work too: meetings, to-dos, decisions"]
      alt: "The Progress page: hours recorded, upcoming exams, review streak and cards to review."

inpiu:
  kicker: "And more"
  h2: "Respectful and convenient"
  p: "The details that make the difference, for you and for the people you record."
  voci:
    - img: "avvisa-en"
      t: "Notify participants in one tap"
      p: "For every recording Verba Manent offers a ready-made message: paste it into the Meet, Teams or Zoom chat, or read it out loud in the classroom. When you press «Done, I've told them», the time is noted in the recording."
      punti: ["A different message for lectures, meetings, webinars and classrooms", "In Italian or English, in the language of the lecture", "The time of the notice stays with the recording"]
      alt: "The «Notify participants» card during a recording, with the ready-made message to copy."
    - img: "prima-di-iniziare-en"
      t: "Privacy explained clearly, before you start"
      p: "On first start a box tells you in four lines what stays on your computer and what leaves, and asks you to confirm you have permission to record. No fine print: read it again anytime in Settings."
      punti: ["Recordings stay on your computer", "No voiceprints, ever", "Error reports only if you say yes, without your content"]
      alt: "The «Before you start» box with the privacy points and the permission-to-record checkbox."
    - img: "importa-en"
      t: "Already have the lecture? Import it"
      p: "No need to record everything from scratch. Import a video or audio file, a Drive, OneDrive, Dropbox or Zoom link, or a transcript in PDF or Word: Verba Manent turns it into notes, flashcards and exam questions."
      punti: ["Video and audio: mp4, mov, mp3, m4a, voice notes…", "Links to recordings already online", "Transcripts in PDF, Word or text"]
      alt: "The Record screen with the boxes to import a video, an audio file or a transcript."
    - img: "dove-trascrivo-en"
      t: "Fast even on a slow PC"
      p: "By default it transcribes on your PC, for free, and the audio never leaves it. If your computer is slow you can choose your own pay-as-you-go transcription server: an hour of lecture in about a minute, and the audio is deleted when the work is done."
      punti: ["On the PC: free and offline", "On the server: a few cents per hour, only if you choose it", "If the server doesn't answer, it falls back to the PC by itself"]
      alt: "The «Where I transcribe» settings with the On the PC and On the server options."
    - img: "telefono-en"
      t: "On your phone too"
      p: "The same features as the PC, in your pocket: record in class or in a meeting, notify the people present, write your notes during the lecture and find notes, flashcards and exam questions in «My lectures». On iPhone you can also send Voice Memos to Verba Manent with «Share»."
      punti: ["Transcription on the phone", "Spoken notice for the classroom", "Notes, review and exam preparation"]
      alt: "Three screens of the phone app: Record, a recording in progress and My lectures."

