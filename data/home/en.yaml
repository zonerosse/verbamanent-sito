domande:
  kicker: "FAQ"
  h2: "Frequently asked questions"
  voci:
    - { q: "Can I record any lecture?", a: "It depends on your university and your lecturer: many universities have rules about recording lectures. Verba Manent reminds you, but getting permission is up to you." }
    - { q: "Do I need an internet connection?", a: "Not to record and transcribe: everything happens on your computer or phone. You do to create the notes, because the text is processed by artificial intelligence." }
    - { q: "Does it work on my phone?", a: "Yes, on Android and iPhone: it records from the microphone (online lectures too, on speaker), transcribes on the phone and prepares the same notes as on the PC. The Mac version is coming." }
    - { q: "My PC is slow: will transcription take ages?", a: "By default it transcribes while you record, so little is left when the lecture ends. If you want even more speed you can connect your own pay-as-you-go transcription server (a few cents per hour): an hour of lecture in about a minute. It's optional, and if the server doesn't answer, transcription goes back to the PC." }
    - { q: "Where do my recordings go?", a: "Into a folder on your computer that you choose. We never see them." }
    - { q: "Does it recognise people by their voice?", a: "No. It only tells voices apart within the same recording and deletes every trace of the voice when it's done. You give the voices their names." }
    - { q: "How much does it cost?", a: "We'll announce it at launch: people on the waiting list will be the first to know." }

