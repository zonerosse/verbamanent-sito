  pill: "🎓 The note-taking app for students and professionals"
  h1a: "Words fly away."
  h1b: "Notes remain."
  lead: "Verba Manent records the lecture, transcribes it and turns it into clear, organised notes, ready to study. You listen, it does the rest."
  cta1: "Notify me at launch"
  cta2: "See how it works"
  trust:
    - "Recordings stay on your computer"
    - "No voiceprints"
    - "In English and Italian"
  demo:
    bar: "Recording · Contract Law · 00:42:17"
    ascolta: "You listen"
    studia: "You study"
    riga: "“A contract is an agreement between two or more parties…”"
    docente: "Lecturer"
    k1: "Contract"
    v1: "A legally binding agreement between two or more parties"
    k2: "Elements"
    v2: "Offer, acceptance, consideration, intention"
